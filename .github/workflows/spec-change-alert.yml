name: Spec Change Alert

on:
  pull_request:
    branches: [main]
    paths:
      - 'spec/**'

permissions:
  pull-requests: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flag golden re-baseline
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `⚠️ **Spec changed** — golden values in \`data/seeds/golden_results.json\` may need re-baselining.\n\nAfter merging, run the analysis with the updated spec, verify the new results, and commit the new golden baseline:\n\`\`\`bash\nuv run python analysis/fed_vix_impact.py\n# review results\ncp analysis/results.json data/seeds/golden_results.json\ngit commit -am "re-baseline golden for spec change"\n\`\`\``
            });
