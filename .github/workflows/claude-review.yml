name: Claude Governance Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Anthropic SDK
        run: pip install anthropic

      - name: Review diff for governance violations
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD)
          python - <<'PYEOF'
          import os, json, subprocess
          from anthropic import Anthropic

          diff = os.environ.get("DIFF", "")
          if not diff:
              diff = subprocess.run(
                  ["git", "diff", f"origin/{os.environ['GITHUB_BASE_REF']}...HEAD"],
                  capture_output=True, text=True
              ).stdout

          client = Anthropic()
          response = client.messages.create(
              model="claude-sonnet-4-20250514",
              max_tokens=2048,
              messages=[{"role": "user", "content": f"""Review this PR diff for governance violations per CLAUDE.md.
          Check for:
          1. SECRETS: Any read/write/commit of *.key, *.pem, .env*, or secrets/
          2. DATA GOVERNANCE: Any raw HTTP, curl, wget, requests.get() for financial data (must use fred-gateway only)
          3. ANALYSIS INTEGRITY: Analysis code must include provenance, assumptions & limitations, sanity checks, persist to results.json
          4. SPEC COMPLIANCE: Exports must match interface_contract in spec/analysis_spec.json
          5. DESTRUCTIVE COMMANDS: Any rm -rf, force push, DROP

          Respond with a short summary: violations found (list each) or "No governance violations detected."

          DIFF:
          {diff[:50000]}"""}],
          )
          review = response.content[0].text

          # Post as PR comment
          pr = os.environ["PR_NUMBER"]
          repo = os.environ["GITHUB_REPOSITORY"]
          subprocess.run([
              "gh", "api",
              f"repos/{repo}/issues/{pr}/comments",
              "-f", f"body=## Claude Governance Review\n\n{review}",
          ], check=True)
          PYEOF
