name: Determinism Gate

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run analysis
        run: uv run python analysis/fed_vix_impact.py

      - name: Run 5-check eval harness
        run: uv run python scripts/eval_regeneration.py
